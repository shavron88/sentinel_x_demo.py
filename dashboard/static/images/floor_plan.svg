<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" width="1200" height="750">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(96,165,250,0.10)" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1b30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- Outer walls -->
  <rect x="40" y="40" width="1120" height="670" rx="14" fill="none" stroke="#3b82f6" stroke-width="4"/>
  <rect x="52" y="52" width="1096" height="646" rx="10" fill="none" stroke="rgba(59,130,246,0.35)" stroke-width="2"/>

  <!-- Interior partitions -->
  <line x1="430" y1="40" x2="430" y2="430" stroke="#60a5fa" stroke-width="3"/>
  <line x1="430" y1="430" x2="40" y2="430" stroke="#60a5fa" stroke-width="3"/>
  <line x1="760" y1="40" x2="760" y2="710" stroke="#60a5fa" stroke-width="3"/>
  <line x1="760" y1="300" x2="1160" y2="300" stroke="#60a5fa" stroke-width="3"/>
  <line x1="430" y1="430" x2="760" y2="430" stroke="#60a5fa" stroke-width="3"/>

  <!-- Door gaps (small wall breaks) -->
  <rect x="410" y="240" width="40" height="14" fill="#0b1220"/>
  <rect x="745" y="180" width="14" height="40" fill="#0b1220"/>
  <rect x="745" y="560" width="14" height="40" fill="#0b1220"/>

  <!-- Zone labels -->
  <g fill="rgba(226,232,240,0.55)" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1">
    <text x="230" y="240">LOBBY</text>
    <text x="590" y="200">MAIN HALL</text>
    <text x="930" y="170">SERVER ROOM</text>
    <text x="230" y="560">STORAGE</text>
    <text x="590" y="560">CORRIDOR</text>
    <text x="930" y="560">RECEPTION</text>
  </g>

  <!-- Entrance marker -->
  <g stroke="#22c55e" stroke-width="3" fill="none">
    <path d="M200 710 v-26 a14 14 0 0 1 28 0 v26"/>
    <line x1="214" y1="684" x2="214" y2="710"/>
  </g>
  <text x="160" y="700" fill="#22c55e" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">ENTRANCE</text>

  <!-- Subtle accent sweep -->
  <circle cx="600" cy="375" r="360" fill="none" stroke="rgba(59,130,246,0.08)" stroke-width="40"/>
</svg>
