{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Register Face ID</h2>
    <form action="{{ url_for('register_face') }}" method="POST" enctype="multipart/form-data" class="mt-3">
        <div class="mb-3">
            <label for="name" class="form-label">Person Name / ID</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
            <label for="face_image" class="form-label">Upload Face Image</label>
            <input type="file" class="form-control" id="face_image" name="face_image" accept="image/*" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Face Profile</button>
    </form>
</div>
{% endblock %}
