{% extends "base.html" %}

{% block content %}

<div class="page-content fade-in">

<div class="notification-history-container">

    <!-- HEADER -->

    <div class="notification-header">

         <div class="notification-header-title">

             <h1 class="page-title">Notification History</h1>

             <p>All alerts and system notifications</p>

         </div>

         <div class="notification-header-actions">

             <button class="btn btn-secondary" onclick="markAllAsRead()">

                 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">

                     <polyline points="20 6 9 17 4 12"></polyline>

                 </svg>

                 Mark All Read

             </button>

             <button class="btn btn-primary" onclick="showToast('Notifications','Test alert fired','info')">

                 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">

                     <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>

                     <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>

                 </svg>

                 Test Alert

             </button>

         </div>

     </div>

    <!-- TOOLBAR -->

    <div class="notification-toolbar">

        <div class="notification-search">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">

                <circle cx="11" cy="11" r="8"></circle>

                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

            </svg>

            <input type="text" id="notificationSearch" placeholder="Search notifications..." oninput="filterNotifications()">

        </div>

        <div class="notification-filters" id="notificationFilters">

            <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">All</button>

            <button class="filter-chip" data-filter="danger" onclick="setFilter('danger')">🚨 Critical</button>

            <button class="filter-chip" data-filter="warning" onclick="setFilter('warning')">⚠️ Warning</button>

            <button class="filter-chip" data-filter="success" onclick="setFilter('success')">✅ Success</button>

            <button class="filter-chip" data-filter="info" onclick="setFilter('info')">ℹ️ Info</button>

        </div>

    </div>

    <!-- ACTIONS BAR -->

    <div class="notification-actions-bar">

        <div class="notification-stats" id="notificationStats">Loading...</div>

        <button class="notification-clear-btn" onclick="clearNotificationHistory()">Clear All History</button>

    </div>

    <!-- HISTORY LIST -->

    <div id="notificationHistoryList" class="notification-history-list">

    </div>

    <!-- EMPTY STATE -->

    <div id="historyEmptyState" class="notification-history-empty">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>

            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>

        </svg>

        <h3>No Notifications Yet</h3>

        <p>When alerts are generated, they will appear here.</p>

    </div>

</div>

</div>

<script>

(function() {

    showSkeletonRows("notificationHistoryList", 8);

})();

</script>

{% endblock %}
