{% extends "base.html" %}

{% block content %}

<style>
/* ==========================================
   CAMERA MANAGER - LATEST CARD STYLE
   Exclusive modern design, no legacy styles
========================================= */
.camera-manager {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
}

.camera-manager-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
}

.camera-manager-header h2 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    color: #f1f5f9;
}

.camera-manager-header .subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-top: 4px;
}

/* Button Styles */
.cm-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
    font-family: inherit;
}

.cm-btn-primary {
    background: linear-gradient(135deg, #3b82f6, #60a5fa);
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.25);
}

.cm-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
}

.cm-btn-secondary {
    background: rgba(59, 130, 246, 0.1);
    color: #e2e8f0;
    border: 1px solid rgba(59, 130, 246, 0.2);
}

.cm-btn-secondary:hover {
    background: rgba(59, 130, 246, 0.2);
    border-color: rgba(59, 130, 246, 0.3);
}

.cm-btn-danger {
    background: rgba(239, 68, 68, 0.15);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.25);
}

.cm-btn-danger:hover {
    background: rgba(239, 68, 68, 0.25);
}

/* Camera Grid */
.camera-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
}

/* Latest Card Style - PERMANENT */
.cam-card {
    background: #1b2432 !important;
    border-radius: 16px !important;
    border: 1px solid rgba(59, 130, 246, 0.1) !important;
    overflow: hidden !important;
    transition: all 0.3s ease !important;
    animation: none !important;
    box-shadow: none !important;
}

.cam-card:hover {
    transform: translateY(-4px) !important;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(59, 130, 246, 0.2) !important;
    border-color: rgba(59, 130, 246, 0.3) !important;
}

.cam-card-header {
    display: flex !important;
    justify-content: space-between !important;
    align-items: flex-start !important;
    padding: 16px 20px !important;
    border-bottom: 1px solid rgba(59, 130, 246, 0.1) !important;
}

.cam-card-header h3 {
    margin: 0 !important;
    font-size: 16px !important;
    font-weight: 700 !important;
    color: #f1f5f9 !important;
}

.cam-card-header .cam-type {
    font-size: 11px !important;
    font-weight: 600 !important;
    padding: 4px 10px !important;
    border-radius: 20px !important;
    text-transform: uppercase !important;
    letter-spacing: 0.5px !important;
    margin-top: 6px !important;
    display: inline-block !important;
}

.cam-type-rtsp {
    background: rgba(239, 68, 68, 0.15) !important;
    color: #ef4444 !important;
    border: 1px solid rgba(239, 68, 68, 0.25) !important;
}

.cam-type-webcam {
    background: rgba(34, 197, 94, 0.15) !important;
    color: #22c55e !important;
    border: 1px solid rgba(34, 197, 94, 0.25) !important;
}

.cam-type-http {
    background: rgba(59, 130, 246, 0.15) !important;
    color: #3b82f6 !important;
    border: 1px solid rgba(59, 130, 246, 0.25) !important;
}

.cam-card-body {
    padding: 16px 20px !important;
}

.cam-card-body .meta-row {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    padding: 6px 0 !important;
    font-size: 13px !important;
}

.cam-card-body .meta-label {
    color: #94a3b8 !important;
    font-weight: 500 !important;
}

.cam-card-body .meta-value {
    color: #e2e8f0 !important;
    font-weight: 600 !important;
    font-variant-numeric: tabular-nums !important;
}

.cam-card-footer {
    display: flex !important;
    gap: 8px !important;
    padding: 12px 20px !important;
    border-top: 1px solid rgba(59, 130, 246, 0.1) !important;
    background: rgba(15, 23, 42, 0.3) !important;
}

.cam-card-footer .cm-btn {
    flex: 1 1 auto !important;
    justify-content: center !important;
    padding: 8px 10px !important;
    font-size: 12px !important;
    min-height: 36px !important;
    min-width: 0 !important;
}
.cam-card-footer a { flex: 1 1 auto; min-width: 0; text-decoration: none; display: flex; }
.cam-card-footer { flex-wrap: wrap !important; }

.status-online { color: #22c55e; }
.status-offline { color: #ef4444; }
.status-connecting { color: #facc15; }

/* Modal */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
}

.modal-overlay.active {
    display: flex !important;
}
.modal-overlay.active .modal {
    display: flex !important;
    flex-direction: column;
}

.modal {
    background: #1b2432;
    border: 1px solid rgba(59, 130, 246, 0.15);
    border-radius: 20px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    border-bottom: 1px solid rgba(59, 130, 246, 0.1);
}

.modal-header h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    color: #f1f5f9;
}

.modal-close {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
}

.modal-close:hover {
    background: rgba(59, 130, 246, 0.1);
    color: #f1f5f9;
}

.modal-body {
    padding: 24px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(59, 130, 246, 0.15);
    background: #0f172a;
    color: #f1f5f9;
    font-size: 14px;
    transition: all 0.2s;
    box-sizing: border-box;
    font-family: inherit;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.form-group .help-text {
    font-size: 12px;
    color: #64748b;
    margin-top: 4px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.modal-footer {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid rgba(59, 130, 246, 0.1);
    justify-content: flex-end;
}

.modal-footer .cm-btn {
    min-width: 100px;
}

.test-result {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    display: none;
}

.test-result.success {
    display: block;
    background: rgba(34, 197, 94, 0.1);
    color: #22c55e;
    border: 1px solid rgba(34, 197, 94, 0.2);
}

.test-result.error {
    display: block;
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.2);
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #94a3b8;
}

.empty-state svg {
    margin-bottom: 16px;
    opacity: 0.5;
}

.empty-state h3 {
    color: #f1f5f9;
    margin: 0 0 8px 0;
}

/* Responsive */
@media (max-width: 768px) {
    .camera-grid {
        grid-template-columns: 1fr;
    }
    
    .camera-manager-header {
        flex-direction: column;
        align-items: flex-start;
    }
    
    .form-row {
        grid-template-columns: 1fr;
    }
    
    .modal-footer {
        flex-direction: column;
    }
    
    .modal-footer .cm-btn {
        width: 100%;
    }
}
</style>

<div class="camera-manager">
    <div class="camera-manager-header">
        <div>
            <h2>Camera Management</h2>
            <p class="subtitle">Connect and manage IP cameras, RTSP streams, and webcams</p>
        </div>
        <button class="cm-btn cm-btn-primary" onclick="openAddCameraModal()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Camera
        </button>
    </div>

    <div id="camera-grid" class="camera-grid"></div>
    <div id="emptyState" class="empty-state" style="display:none;"></div>
</div>

<!-- Add Camera Modal (moved into <body> by JS for reliable top-level stacking) -->
<div id="addCameraModalRoot" data-add-camera-root style="display:none;"></div>

<script>
/* ============================================================
   Sentinel-X Â· Cameras page â€” rebuilt for reliable Add Camera
   - Modal is built into a top-level host (document.body)
   - All interactions go through delegated listeners
   - No reliance on inline onclick, external CSS, or sessionStorage
============================================================ */
(function () {
    "use strict";

    /* ---------- CSRF helpers (idempotent) ---------- */
    function getCSRF() {
        try { if (window.__SENTINELX_CSRF__) return window.__SENTINELX_CSRF__; } catch (e) {}
        try { return sessionStorage.getItem("sentinelx_csrf"); } catch (e) { return null; }
    }
    function setCSRF(t) {
        try { window.__SENTINELX_CSRF__ = t; } catch (e) {}
        try { sessionStorage.setItem("sentinelx_csrf", t); } catch (e) {}
    }
    var _csrfRefresh = null;
    function ensureCSRF() {
        var t = getCSRF();
        if (t) return Promise.resolve(t);
        if (_csrfRefresh) return _csrfRefresh;
        _csrfRefresh = fetch("/api/auth/csrf-token", { credentials: "same-origin" })
            .then(function (r) { return r && r.ok ? r.json() : null; })
            .then(function (d) { return (d && d.csrf_token) ? (setCSRF(d.csrf_token), d.csrf_token) : null; })
            .catch(function () { return null; })
            .then(function (v) { _csrfRefresh = null; return v; });
        return _csrfRefresh;
    }
    async function fetchWithCSRF(url, options) {
        options = options || {};
        options.credentials = options.credentials || "same-origin";
        var headers = options.headers || {};
        var token = await ensureCSRF();
        if (token) headers["X-CSRF-Token"] = token;
        options.headers = headers;
        var res = await fetch(url, options);
        if (res.status === 401 || res.status === 403) {
            try { window.__SENTINELX_CSRF__ = null; sessionStorage.removeItem("sentinelx_csrf"); } catch (e) {}
            var fresh = await ensureCSRF();
            if (fresh) {
                headers["X-CSRF-Token"] = fresh;
                options.headers = headers;
                res = await fetch(url, options);
            }
        }
        return res;
    }

    /* ---------- Modal host & DOM ---------- */
    var HOST_ID = "addCameraModal";
    function buildModalDOM() {
        var existing = document.getElementById(HOST_ID);
        if (existing) return existing;
        var overlay = document.createElement("div");
        overlay.id = HOST_ID;
        overlay.setAttribute("data-add-camera-modal", "1");
        overlay.style.cssText = [
            "position:fixed", "inset:0", "display:none",
            "align-items:center", "justify-content:center",
            "background:rgba(2,6,23,.65)", "backdrop-filter:blur(6px)",
            "z-index:2147483600", "padding:16px"
        ].join(";");
        overlay.innerHTML = [
            '<div data-add-camera-card style="background:#0f172a;color:#e2e8f0;width:100%;max-width:520px;max-height:92vh;overflow:auto;border:1px solid rgba(59,130,246,.25);border-radius:16px;box-shadow:0 25px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;">',
                '<div style="display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid rgba(59,130,246,.15);">',
                    '<h3 style="margin:0;font-size:18px;color:#f1f5f9;">Add New Camera</h3>',
                    '<button type="button" data-add-camera-action="close" aria-label="Close" style="background:none;border:none;color:#94a3b8;font-size:22px;line-height:1;cursor:pointer;padding:6px 10px;border-radius:8px;">&times;</button>',
                '</div>',
                '<div style="padding:20px 22px;display:flex;flex-direction:column;gap:14px;">',
                    '<label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px;">Camera Name',
                        '<input type="text" id="camName" placeholder="e.g. Front Entrance" style="padding:10px 14px;border-radius:10px;border:1px solid rgba(59,130,246,.2);background:#0a1428;color:#f1f5f9;font-size:14px;font-family:inherit;box-sizing:border-box;" />',
                    '</label>',
                    '<label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px;">Camera Type',
                        '<select id="camType" data-add-camera-action="type" style="padding:10px 14px;border-radius:10px;border:1px solid rgba(59,130,246,.2);background:#0a1428;color:#f1f5f9;font-size:14px;font-family:inherit;box-sizing:border-box;">',
                            '<option value="webcam">Webcam (Local)</option>',
                            '<option value="rtsp">IP Camera / RTSP</option>',
                            '<option value="http">HTTP Stream / MJPEG</option>',
                        '</select>',
                    '</label>',
                    '<label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px;">Stream Source',
                        '<input type="text" id="camSource" placeholder="0 for webcam, or rtsp://192.168.1.100:554/stream" style="padding:10px 14px;border-radius:10px;border:1px solid rgba(59,130,246,.2);background:#0a1428;color:#f1f5f9;font-size:14px;font-family:inherit;box-sizing:border-box;" />',
                        '<small id="camSourceHelp" style="color:#64748b;font-size:12px;">Enter 0 for the default local webcam.</small>',
                    '</label>',
                    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">',
                        '<label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px;">Zone / Location',
                            '<input type="text" id="camZone" value="General Area" style="padding:10px 14px;border-radius:10px;border:1px solid rgba(59,130,246,.2);background:#0a1428;color:#f1f5f9;font-size:14px;font-family:inherit;box-sizing:border-box;" />',
                        '</label>',
                        '<label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px;">Reconnect (s)',
                            '<input type="number" id="camReconnect" value="5" min="1" max="60" style="padding:10px 14px;border-radius:10px;border:1px solid rgba(59,130,246,.2);background:#0a1428;color:#f1f5f9;font-size:14px;font-family:inherit;box-sizing:border-box;" />',
                        '</label>',
                    '</div>',
                    '<label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px;">RTSP Transport',
                        '<select id="camTransport" style="padding:10px 14px;border-radius:10px;border:1px solid rgba(59,130,246,.2);background:#0a1428;color:#f1f5f9;font-size:14px;font-family:inherit;box-sizing:border-box;">',
                            '<option value="tcp">TCP (Reliable)</option>',
                            '<option value="udp">UDP (Low Latency)</option>',
                        '</select>',
                    '</label>',
                    '<div id="testResult" style="display:none;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;"></div>',
                '</div>',
                '<div style="display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid rgba(59,130,246,.15);flex-wrap:wrap;">',
                    '<button type="button" data-add-camera-action="test" style="background:rgba(59,130,246,.12);color:#e2e8f0;border:1px solid rgba(59,130,246,.25);padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px;">Test Connection</button>',
                    '<button type="button" data-add-camera-action="cancel" style="background:rgba(59,130,246,.12);color:#e2e8f0;border:1px solid rgba(59,130,246,.25);padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px;">Cancel</button>',
                    '<button type="button" data-add-camera-action="save" style="background:linear-gradient(135deg,#3b82f6,#60a5fa);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;box-shadow:0 4px 14px rgba(59,130,246,.3);">Add Camera</button>',
                '</div>',
            '</div>'
        ].join("");
        document.body.appendChild(overlay);
        return overlay;
    }

    function setResult(kind, msg) {
        var el = document.getElementById("testResult");
        if (!el) return;
        var styles = {
            success: "background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.3);",
            error:   "background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.3);",
            info:    "background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.3);"
        }[kind] || "background:rgba(148,163,184,.08);color:#94a3b8;border:1px solid rgba(148,163,184,.2);";
        el.style.cssText = "padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;display:block;" + styles;
        el.textContent = msg;
    }

    function getVal(id) {
        var el = document.getElementById(id);
        return el ? el.value : "";
    }

    /* ---------- Open / Close ---------- */
    function openAddCameraModal() {
        var overlay = buildModalDOM();
        overlay.style.display = "flex";
        var n = document.getElementById("camName"); if (n) n.value = "";
        var s = document.getElementById("camSource"); if (s) s.value = "";
        var z = document.getElementById("camZone"); if (z) z.value = "General Area";
        var r = document.getElementById("camReconnect"); if (r) r.value = "5";
        var tr = document.getElementById("testResult"); if (tr) tr.style.display = "none";
        var t = document.getElementById("camType"); if (t) t.value = "webcam";
        updateCameraPlaceholder();
        if (n) setTimeout(function(){ n.focus(); }, 30);
    }
    function closeAddCameraModal() {
        var overlay = document.getElementById(HOST_ID);
        if (overlay) overlay.style.display = "none";
    }

    function updateCameraPlaceholder() {
        var type = getVal("camType");
        var input = document.getElementById("camSource");
        var help = document.getElementById("camSourceHelp");
        if (!input || !help) return;
        if (type === "rtsp") {
            input.placeholder = "rtsp://192.168.1.100:554/stream";
            help.textContent = "Full RTSP URL from your CCTV / NVR.";
        } else if (type === "http") {
            input.placeholder = "http://192.168.1.100:8080/video";
            help.textContent = "HTTP MJPEG or HLS stream URL.";
        } else {
            input.placeholder = "0 for default webcam, 1 for external";
            help.textContent = "Enter 0 for the default local webcam, 1 for external USB camera.";
        }
    }

    /* ---------- Network actions ---------- */
    async function testCameraConnection() {
        var source = getVal("camSource").trim();
        if (!source) { setResult("error", "Please enter a stream source."); return; }
        setResult("info", "Testing connection...");
        try {
            var response = await fetchWithCSRF("/api/camera/test-connection", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ source: source })
            });
            var data = await response.json().catch(function(){ return {}; });
            if (response.status === 403) { setResult("error", "Security token expired. Please refresh the page."); return; }
            if (data.success) {
                setResult("success", "Connection successful! Resolution: " + (data.resolution || "Unknown") + ", FPS: " + (data.fps || "--"));
            } else {
                setResult("error", "Connection failed: " + (data.error || "Unknown error"));
            }
        } catch (e) {
            setResult("error", "Test error: " + e.message);
        }
    }

    async function addCamera() {
        var name = getVal("camName").trim();
        var type = getVal("camType");
        var source = getVal("camSource").trim();
        var zone = getVal("camZone").trim();
        var reconnect = parseInt(getVal("camReconnect"), 10) || 5;
        var transport = getVal("camTransport");

        if (!name || !source) {
            setResult("error", "Camera name and source are required.");
            showToast("Validation", "Camera name and source are required.", "warning");
            return;
        }

        var payload = {
            name: name, type: type, source: source, zone: zone,
            reconnect_delay: reconnect, rtsp_transport: transport,
            is_rtsp: type === "rtsp" ? 1 : 0
        };
        try {
            var response = await fetchWithCSRF("/api/camera/add", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            var data = await response.json().catch(function(){ return {}; });
            if (response.status === 403) {
                showToast("Error", "Security token expired. Please refresh the page.", "warning");
                return;
            }
            if (data.success) {
                showToast("Camera Added", "Camera \"" + name + "\" has been added successfully.", "success");
                closeAddCameraModal();
                if (typeof window.loadCameras === "function") window.loadCameras();
                else if (typeof loadCameras === "function") loadCameras();
            } else {
                setResult("error", data.error || "Failed to add camera.");
                showToast("Error", data.error || "Failed to add camera.", "error");
            }
        } catch (e) {
            setResult("error", "Failed to add camera: " + e.message);
            showToast("Error", "Failed to add camera: " + e.message, "error");
        }
    }

    /* ---------- Camera card actions (delegated) ---------- */
    async function removeCamera(name) {
        if (!window.confirm('Remove camera "' + name + '"? This will stop the stream.')) return;
        try {
            var r = await fetchWithCSRF("/api/camera/remove/" + encodeURIComponent(name), { method: "DELETE" });
            var d = await r.json().catch(function(){ return {}; });
            if (d.success) {
                showToast("Camera Removed", "Camera \"" + name + "\" removed.", "info");
                if (typeof loadCameras === "function") loadCameras();
            } else {
                showToast("Error", d.error || "Failed to remove camera.", "error");
            }
        } catch (e) { showToast("Error", "Failed to remove camera: " + e.message, "error"); }
    }
    async function startCamera(name) {
        try {
            var r = await fetchWithCSRF("/api/camera/start/" + encodeURIComponent(name), { method: "POST" });
            var d = await r.json().catch(function(){ return {}; });
            if (d.success) { showToast("Camera Started", "Camera \"" + name + "\" is starting.", "success"); loadCameras(); }
            else showToast("Error", d.error || "Failed to start camera.", "error");
        } catch (e) { showToast("Error", "Failed to start camera: " + e.message, "error"); }
    }
    async function stopCamera(name) {
        try {
            var r = await fetchWithCSRF("/api/camera/stop/" + encodeURIComponent(name), { method: "POST" });
            var d = await r.json().catch(function(){ return {}; });
            if (d.success) { showToast("Camera Stopped", "Camera \"" + name + "\" stopped.", "info"); loadCameras(); }
            else showToast("Error", d.error || "Failed to stop camera.", "error");
        } catch (e) { showToast("Error", "Failed to stop camera: " + e.message, "error"); }
    }
    async function takeSnapshot(name) {
        try {
            var r = await fetchWithCSRF("/api/camera/snapshot", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ camera_name: name })
            });
            var d = await r.json().catch(function(){ return {}; });
            if (d.success) showToast("Snapshot", "Snapshot captured successfully", "success");
            else showToast("Snapshot", d.error || "Failed to capture snapshot", "error");
        } catch (e) { showToast("Snapshot", "Failed to capture snapshot", "error"); }
    }

    /* ---------- Grid render ---------- */
    function escapeHtml(text) {
        if (text == null) return "";
        return String(text).replace(/[&<>"']/g, function (c) {
            return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
        });
    }

    function renderCameras(cameras) {
        var grid = document.getElementById("camera-grid");
        if (!grid) return;
        grid.innerHTML = "";
        var empty = document.getElementById("emptyState");
        if (!cameras.length) {
            if (empty) {
                empty.style.display = "block";
                empty.innerHTML = '<div style="font-size:48px;margin-bottom:16px;opacity:.6;">ðŸ“¹</div>' +
                    '<h3 style="color:#f1f5f9;margin:0 0 8px 0;">No Cameras Found</h3>' +
                    '<p style="color:#94a3b8;margin:0 0 20px 0;">Get started by adding your first camera.</p>' +
                    '<button type="button" data-add-camera-action="open" style="background:linear-gradient(135deg,#3b82f6,#60a5fa);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:600;cursor:pointer;">Add Camera</button>';
            }
            return;
        }
        if (empty) empty.style.display = "none";
        cameras.forEach(function (camera) {
            var card = document.createElement("div");
            card.className = "cam-card";
            var isOnline = camera.status === "ONLINE";
            var typeClass = camera.type === "rtsp" ? "cam-type-rtsp" : camera.type === "http" ? "cam-type-http" : "cam-type-webcam";
            var typeLabel = camera.type === "rtsp" ? "RTSP" : camera.type === "http" ? "HTTP" : "WEBCAM";
            var escName = escapeHtml(camera.name);
            card.innerHTML = [
                '<div class="cam-card-header">',
                    '<div>',
                        '<h3>' + escName + '</h3>',
                        '<span class="cam-type ' + typeClass + '">' + typeLabel + '</span>',
                    '</div>',
                    '<span class="' + (isOnline ? "status-online" : camera.status === "CONNECTING" ? "status-connecting" : "status-offline") + '">â— ' + escapeHtml(camera.status) + '</span>',
                '</div>',
                '<div class="cam-card-body">',
                    row("Location", camera.location),
                    row("Resolution", camera.resolution),
                    row("FPS", camera.fps),
                    row("Latency", camera.latency + " ms"),
                    row("Health", camera.health),
                '</div>',
                '<div class="cam-card-footer">',
                    isOnline
                        ? '<a href="/camera_view?camera=' + encodeURIComponent(camera.name) + '" style="flex:1 1 auto;min-width:0;text-decoration:none;display:flex;"><button type="button" class="cm-btn cm-btn-primary">Live</button></a>'
                          + '<a href="/replay" style="flex:1 1 auto;min-width:0;text-decoration:none;display:flex;"><button type="button" class="cm-btn cm-btn-secondary">Replay</button></a>'
                          + '<button type="button" class="cm-btn cm-btn-secondary" data-camera-action="stop" data-name="' + escName + '">Stop</button>'
                        : '<button type="button" class="cm-btn cm-btn-primary" data-camera-action="start" data-name="' + escName + '">Start</button>'
                          + '<button type="button" class="cm-btn cm-btn-secondary" data-camera-action="remove" data-name="' + escName + '">Remove</button>',
                    '<button type="button" class="cm-btn cm-btn-secondary" data-camera-action="snapshot" data-name="' + escName + '">Snapshot</button>',
                '</div>'
            ].join("");
            grid.appendChild(card);
        });
    }
    function row(label, value) {
        return '<div class="meta-row"><span class="meta-label">' + escapeHtml(label) + '</span><span class="meta-value">' + escapeHtml(value == null ? "--" : value) + '</span></div>';
    }

    async function loadCameras() {
        var grid = document.getElementById("camera-grid");
        if (!grid) return;
        grid.innerHTML = "";
        for (var i = 0; i < 4; i++) {
            var sk = document.createElement("div");
            sk.className = "cam-card";
            sk.innerHTML = '<div style="padding:16px 20px;"><div style="width:60%;height:16px;background:rgba(255,255,255,.1);border-radius:4px;margin-bottom:12px;"></div><div style="width:100%;height:18px;background:rgba(255,255,255,.05);border-radius:4px;margin-bottom:8px;"></div><div style="width:100%;height:18px;background:rgba(255,255,255,.05);border-radius:4px;margin-bottom:8px;"></div><div style="width:100%;height:18px;background:rgba(255,255,255,.05);border-radius:4px;"></div></div>';
            grid.appendChild(sk);
        }
        try {
            var response = await fetchWithCSRF("/api/cameras");
            if (response.status === 401) { window.location.href = "/login"; return; }
            if (!response.ok) throw new Error("HTTP " + response.status);
            var data = await response.json();
            var cameras = [];
            if (Array.isArray(data)) cameras = data;
            else if (data && typeof data === "object") {
                Object.keys(data).forEach(function (k) {
                    var cam = data[k] || {};
                    cameras.push({
                        id: k, name: cam.name || k,
                        location: cam.zone || cam.location || "Unknown",
                        status: cam.status || "OFFLINE",
                        resolution: cam.resolution || "640x480",
                        fps: cam.fps || 0, latency: cam.latency || 0,
                        health: cam.health || "UNKNOWN",
                        is_rtsp: cam.is_rtsp || false,
                        type: cam.is_rtsp ? "rtsp" : "webcam"
                    });
                });
            }
            renderCameras(cameras);
        } catch (err) {
            grid.innerHTML = "";
            var empty = document.getElementById("emptyState");
            if (empty) {
                empty.style.display = "block";
                empty.innerHTML = '<div style="font-size:48px;margin-bottom:16px;opacity:.6;">âš ï¸</div><h3 style="color:#f1f5f9;margin:0 0 8px 0;">Unable to Load Cameras</h3><p style="color:#94a3b8;margin:0 0 20px 0;">The camera service could not be reached.</p><button type="button" data-add-camera-action="retry" style="background:linear-gradient(135deg,#3b82f6,#60a5fa);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:600;cursor:pointer;">Retry</button>';
            }
        }
    }

    /* ---------- Toast ---------- */
    function showToast(title, message, type) {
        var t = document.createElement("div");
        t.style.cssText = "position:fixed;bottom:24px;right:24px;background:#1b2432;border:1px solid rgba(59,130,246,.2);border-radius:12px;padding:14px 18px;color:#f1f5f9;font-size:14px;z-index:2147483600;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:all .25s ease;";
        t.innerHTML = '<div style="font-weight:600;margin-bottom:4px;">' + escapeHtml(title) + '</div><div style="color:#94a3b8;">' + escapeHtml(message) + '</div>';
        document.body.appendChild(t);
        requestAnimationFrame(function(){ t.style.opacity = "1"; t.style.transform = "translateY(0)"; });
        setTimeout(function(){ t.style.opacity = "0"; t.style.transform = "translateY(10px)"; setTimeout(function(){ t.remove(); }, 300); }, 3000);
    }

    /* ---------- Wiring ---------- */
    function bindGlobal() {
        // Open: any element with data-add-camera-action="open" (header button, empty-state, etc.)
        document.addEventListener("click", function (ev) {
            var t = ev.target;
            if (!t || !t.closest) return;
            var trigger = t.closest('[data-add-camera-action="open"]');
            if (trigger) { ev.preventDefault(); openAddCameraModal(); return; }
            var a = t.closest('[data-add-camera-action]');
            if (a) {
                var action = a.getAttribute("data-add-camera-action");
                if (action === "close" || action === "cancel") { ev.preventDefault(); closeAddCameraModal(); return; }
                if (action === "test")   { ev.preventDefault(); testCameraConnection(); return; }
                if (action === "save")   { ev.preventDefault(); addCamera(); return; }
                if (action === "retry")  { ev.preventDefault(); loadCameras(); return; }
            }
            // Type select changes
            var sel = t.closest('#camType');
            if (sel && t === sel) updateCameraPlaceholder();

            // Camera card actions
            var ca = t.closest('[data-camera-action]');
            if (ca) {
                ev.preventDefault();
                var name = ca.getAttribute("data-name");
                var act = ca.getAttribute("data-camera-action");
                if (act === "remove") removeCamera(name);
                else if (act === "start") startCamera(name);
                else if (act === "stop") stopCamera(name);
                else if (act === "snapshot") takeSnapshot(name);
            }
        });

        // ESC closes modal
        document.addEventListener("keydown", function (ev) {
            if (ev.key === "Escape") closeAddCameraModal();
        });

        // Click on backdrop closes
        document.addEventListener("click", function (ev) {
            var overlay = document.getElementById(HOST_ID);
            if (overlay && overlay.style.display !== "none" && ev.target === overlay) closeAddCameraModal();
        }, true);

        // Fallback: if any "Add Camera" inline-onclick button still exists, ensure it works.
        // We replace its onclick by re-routing through our delegated handler.
        Array.prototype.forEach.call(document.querySelectorAll('button'), function (b) {
            var oc = b.getAttribute && b.getAttribute('onclick');
            if (oc && /openAddCameraModal/.test(oc)) {
                b.removeAttribute('onclick');
                b.setAttribute('data-add-camera-action', 'open');
            }
            if (b.getAttribute && b.getAttribute('onclick') && /closeAddCameraModal/.test(b.getAttribute('onclick'))) {
                b.removeAttribute('onclick');
                b.setAttribute('data-add-camera-action', 'close');
            }
        });
    }

    /* ---------- Public API ---------- */
    window.openAddCameraModal = openAddCameraModal;
    window.closeAddCameraModal = closeAddCameraModal;
    window.addCamera = addCamera;
    window.testCameraConnection = testCameraConnection;
    window.loadCameras = loadCameras;
    window.startCamera = startCamera;
    window.stopCamera = stopCamera;
    window.removeCamera = removeCamera;
    window.takeSnapshot = takeSnapshot;
    window.updateCameraPlaceholder = updateCameraPlaceholder;
    window.showToast = showToast;

    function init() {
        bindGlobal();
        loadCameras();
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
})();
</script>

{% endblock %}
