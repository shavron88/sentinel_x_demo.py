{% extends "base.html" %}

{% block content %}

<style>
/* ==========================================
   CAMERA MANAGER - LATEST CARD STYLE
   Exclusive modern design, no legacy styles
========================================= */
.camera-manager {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
}

.camera-manager-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
}

.camera-manager-header h2 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    color: #f1f5f9;
}

.camera-manager-header .subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-top: 4px;
}

/* Button Styles */
.cm-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
    font-family: inherit;
}

.cm-btn-primary {
    background: linear-gradient(135deg, #3b82f6, #60a5fa);
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.25);
}

.cm-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
}

.cm-btn-secondary {
    background: rgba(59, 130, 246, 0.1);
    color: #e2e8f0;
    border: 1px solid rgba(59, 130, 246, 0.2);
}

.cm-btn-secondary:hover {
    background: rgba(59, 130, 246, 0.2);
    border-color: rgba(59, 130, 246, 0.3);
}

.cm-btn-danger {
    background: rgba(239, 68, 68, 0.15);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.25);
}

.cm-btn-danger:hover {
    background: rgba(239, 68, 68, 0.25);
}

/* Camera Grid */
.camera-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
}

/* Latest Card Style - PERMANENT */
.cam-card {
    background: #1b2432 !important;
    border-radius: 16px !important;
    border: 1px solid rgba(59, 130, 246, 0.1) !important;
    overflow: hidden !important;
    transition: all 0.3s ease !important;
    animation: none !important;
    box-shadow: none !important;
}

.cam-card:hover {
    transform: translateY(-4px) !important;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(59, 130, 246, 0.2) !important;
    border-color: rgba(59, 130, 246, 0.3) !important;
}

.cam-card-header {
    display: flex !important;
    justify-content: space-between !important;
    align-items: flex-start !important;
    padding: 16px 20px !important;
    border-bottom: 1px solid rgba(59, 130, 246, 0.1) !important;
}

.cam-card-header h3 {
    margin: 0 !important;
    font-size: 16px !important;
    font-weight: 700 !important;
    color: #f1f5f9 !important;
}

.cam-card-header .cam-type {
    font-size: 11px !important;
    font-weight: 600 !important;
    padding: 4px 10px !important;
    border-radius: 20px !important;
    text-transform: uppercase !important;
    letter-spacing: 0.5px !important;
    margin-top: 6px !important;
    display: inline-block !important;
}

.cam-type-rtsp {
    background: rgba(239, 68, 68, 0.15) !important;
    color: #ef4444 !important;
    border: 1px solid rgba(239, 68, 68, 0.25) !important;
}

.cam-type-webcam {
    background: rgba(34, 197, 94, 0.15) !important;
    color: #22c55e !important;
    border: 1px solid rgba(34, 197, 94, 0.25) !important;
}

.cam-type-http {
    background: rgba(59, 130, 246, 0.15) !important;
    color: #3b82f6 !important;
    border: 1px solid rgba(59, 130, 246, 0.25) !important;
}

.cam-card-body {
    padding: 16px 20px !important;
}

.cam-card-body .meta-row {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    padding: 6px 0 !important;
    font-size: 13px !important;
}

.cam-card-body .meta-label {
    color: #94a3b8 !important;
    font-weight: 500 !important;
}

.cam-card-body .meta-value {
    color: #e2e8f0 !important;
    font-weight: 600 !important;
    font-variant-numeric: tabular-nums !important;
}

.cam-card-footer {
    display: flex !important;
    gap: 8px !important;
    padding: 12px 20px !important;
    border-top: 1px solid rgba(59, 130, 246, 0.1) !important;
    background: rgba(15, 23, 42, 0.3) !important;
}

.cam-card-footer .cm-btn {
    flex: 1 !important;
    justify-content: center !important;
    padding: 8px 12px !important;
    font-size: 12px !important;
    min-height: 36px !important;
}

.status-online { color: #22c55e; }
.status-offline { color: #ef4444; }
.status-connecting { color: #facc15; }

/* Modal */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    background: #1b2432;
    border: 1px solid rgba(59, 130, 246, 0.15);
    border-radius: 20px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    border-bottom: 1px solid rgba(59, 130, 246, 0.1);
}

.modal-header h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    color: #f1f5f9;
}

.modal-close {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
}

.modal-close:hover {
    background: rgba(59, 130, 246, 0.1);
    color: #f1f5f9;
}

.modal-body {
    padding: 24px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(59, 130, 246, 0.15);
    background: #0f172a;
    color: #f1f5f9;
    font-size: 14px;
    transition: all 0.2s;
    box-sizing: border-box;
    font-family: inherit;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.form-group .help-text {
    font-size: 12px;
    color: #64748b;
    margin-top: 4px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.modal-footer {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid rgba(59, 130, 246, 0.1);
    justify-content: flex-end;
}

.modal-footer .cm-btn {
    min-width: 100px;
}

.test-result {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    display: none;
}

.test-result.success {
    display: block;
    background: rgba(34, 197, 94, 0.1);
    color: #22c55e;
    border: 1px solid rgba(34, 197, 94, 0.2);
}

.test-result.error {
    display: block;
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.2);
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #94a3b8;
}

.empty-state svg {
    margin-bottom: 16px;
    opacity: 0.5;
}

.empty-state h3 {
    color: #f1f5f9;
    margin: 0 0 8px 0;
}

/* Responsive */
@media (max-width: 768px) {
    .camera-grid {
        grid-template-columns: 1fr;
    }
    
    .camera-manager-header {
        flex-direction: column;
        align-items: flex-start;
    }
    
    .form-row {
        grid-template-columns: 1fr;
    }
    
    .modal-footer {
        flex-direction: column;
    }
    
    .modal-footer .cm-btn {
        width: 100%;
    }
}
</style>

<div class="camera-manager">
    <div class="camera-manager-header">
        <div>
            <h2>Camera Management</h2>
            <p class="subtitle">Connect and manage IP cameras, RTSP streams, and webcams</p>
        </div>
        <button class="cm-btn cm-btn-primary" onclick="openAddCameraModal()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Camera
        </button>
    </div>

    <div id="camera-grid" class="camera-grid"></div>
    <div id="emptyState" class="empty-state" style="display:none;"></div>
</div>

<!-- Add Camera Modal -->
<div class="modal-overlay" id="addCameraModal">
    <div class="modal">
        <div class="modal-header">
            <h3>Add New Camera</h3>
            <button class="modal-close" onclick="closeAddCameraModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Camera Name</label>
                <input type="text" id="camName" placeholder="e.g. Front Entrance" />
            </div>
            <div class="form-group">
                <label>Camera Type</label>
                <select id="camType" onchange="updateCameraPlaceholder()">
                    <option value="webcam">Webcam (Local)</option>
                    <option value="rtsp">IP Camera / RTSP</option>
                    <option value="http">HTTP Stream / MJPEG</option>
                </select>
            </div>
            <div class="form-group">
                <label>Stream Source</label>
                <input type="text" id="camSource" placeholder="0 for webcam, or rtsp://192.168.1.100:554/stream" />
                <p class="help-text" id="camSourceHelp">Enter 0 for the default local webcam.</p>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Zone / Location</label>
                    <input type="text" id="camZone" placeholder="e.g. Main Entrance" value="General Area" />
                </div>
                <div class="form-group">
                    <label>Reconnect Delay (s)</label>
                    <input type="number" id="camReconnect" value="5" min="1" max="60" />
                </div>
            </div>
            <div class="form-group">
                <label>RTSP Transport</label>
                <select id="camTransport">
                    <option value="tcp">TCP (Reliable)</option>
                    <option value="udp">UDP (Low Latency)</option>
                </select>
            </div>
            <div class="test-result" id="testResult"></div>
        </div>
        <div class="modal-footer">
            <button class="cm-btn cm-btn-secondary" onclick="testCameraConnection()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                Test Connection
            </button>
            <button class="cm-btn cm-btn-secondary" onclick="closeAddCameraModal()">Cancel</button>
            <button class="cm-btn cm-btn-primary" onclick="addCamera()">Add Camera</button>
        </div>
    </div>
</div>

<script>
function updateCameraPlaceholder() {
    const type = document.getElementById('camType').value;
    const input = document.getElementById('camSource');
    const help = document.getElementById('camSourceHelp');
    if (type === 'webcam') {
        input.placeholder = '0 for default webcam, 1 for external';
        help.textContent = 'Enter 0 for the default local webcam, 1 for external USB camera.';
    } else if (type === 'rtsp') {
        input.placeholder = 'rtsp://192.168.1.100:554/stream';
        help.textContent = 'Full RTSP URL from your CCTV / NVR.';
    } else {
        input.placeholder = 'http://192.168.1.100:8080/video';
        help.textContent = 'HTTP MJPEG or HLS stream URL.';
    }
}

function openAddCameraModal() {
    document.getElementById('addCameraModal').classList.add('active');
    document.getElementById('camName').value = '';
    document.getElementById('camSource').value = '';
    document.getElementById('camZone').value = 'General Area';
    document.getElementById('testResult').style.display = 'none';
}

function closeAddCameraModal() {
    document.getElementById('addCameraModal').classList.remove('active');
}

async function testCameraConnection() {
    const source = document.getElementById('camSource').value.trim();
    const resultEl = document.getElementById('testResult');
    if (!source) {
        resultEl.className = 'test-result error';
        resultEl.textContent = 'Please enter a stream source.';
        resultEl.style.display = 'block';
        return;
    }
    resultEl.className = 'test-result';
    resultEl.textContent = 'Testing connection...';
    resultEl.style.display = 'block';
    try {
        const response = await fetch('/api/camera/test-connection', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ source: source })
        });
        const data = await response.json();
        if (data.success) {
            resultEl.className = 'test-result success';
            resultEl.textContent = `Connection successful! Resolution: ${data.resolution || 'Unknown'}, FPS: ${data.fps || '--'}`;
        } else {
            resultEl.className = 'test-result error';
            resultEl.textContent = `Connection failed: ${data.error || 'Unknown error'}`;
        }
    } catch (e) {
        resultEl.className = 'test-result error';
        resultEl.textContent = `Test error: ${e.message}`;
    }
}

async function addCamera() {
    const name = document.getElementById('camName').value.trim();
    const type = document.getElementById('camType').value;
    const source = document.getElementById('camSource').value.trim();
    const zone = document.getElementById('camZone').value.trim();
    const reconnect = parseInt(document.getElementById('camReconnect').value) || 5;
    const transport = document.getElementById('camTransport').value;

    if (!name || !source) {
        showToast('Validation', 'Camera name and source are required.', 'warning');
        return;
    }

    const payload = {
        name: name,
        type: type,
        source: source,
        zone: zone,
        reconnect_delay: reconnect,
        rtsp_transport: transport,
        is_rtsp: type === 'rtsp' ? 1 : 0
    };

    try {
        const response = await fetch('/api/camera/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (data.success) {
            showToast('Camera Added', `Camera "${name}" has been added successfully.`, 'success');
            closeAddCameraModal();
            loadCameras();
        } else {
            showToast('Error', data.error || 'Failed to add camera.', 'error');
        }
    } catch (e) {
        showToast('Error', `Failed to add camera: ${e.message}`, 'error');
    }
}

async function removeCamera(name) {
    if (!confirm(`Remove camera "${name}"? This will stop the stream.`)) return;
    try {
        const response = await fetch(`/api/camera/remove/${encodeURIComponent(name)}`, { method: 'DELETE' });
        const data = await response.json();
        if (data.success) {
            showToast('Camera Removed', `Camera "${name}" removed.`, 'info');
            loadCameras();
        } else {
            showToast('Error', data.error || 'Failed to remove camera.', 'error');
        }
    } catch (e) {
        showToast('Error', `Failed to remove camera: ${e.message}`, 'error');
    }
}

async function startCamera(name) {
    try {
        const response = await fetch(`/api/camera/start/${encodeURIComponent(name)}`, { method: 'POST' });
        const data = await response.json();
        if (data.success) {
            showToast('Camera Started', `Camera "${name}" is starting.`, 'success');
            loadCameras();
        } else {
            showToast('Error', data.error || 'Failed to start camera.', 'error');
        }
    } catch (e) {
        showToast('Error', `Failed to start camera: ${e.message}`, 'error');
    }
}

async function stopCamera(name) {
    try {
        const response = await fetch(`/api/camera/stop/${encodeURIComponent(name)}`, { method: 'POST' });
        const data = await response.json();
        if (data.success) {
            showToast('Camera Stopped', `Camera "${name}" stopped.`, 'info');
            loadCameras();
        } else {
            showToast('Error', data.error || 'Failed to stop camera.', 'error');
        }
    } catch (e) {
        showToast('Error', `Failed to stop camera: ${e.message}`, 'error');
    }
}

async function loadCameras() {
    const grid = document.getElementById("camera-grid");
    if (!grid) return;
    grid.innerHTML = "";
    
    // Show skeleton loading
    for (let i = 0; i < 4; i++) {
        const skeleton = document.createElement("div");
        skeleton.className = "cam-card";
        skeleton.innerHTML = `
            <div style="padding:16px 20px;">
                <div style="width:60%;height:16px;background:rgba(255,255,255,0.1);border-radius:4px;margin-bottom:12px;"></div>
                <div style="width:100%;height:18px;background:rgba(255,255,255,0.05);border-radius:4px;margin-bottom:8px;"></div>
                <div style="width:100%;height:18px;background:rgba(255,255,255,0.05);border-radius:4px;margin-bottom:8px;"></div>
                <div style="width:100%;height:18px;background:rgba(255,255,255,0.05);border-radius:4px;"></div>
            </div>
        `;
        grid.appendChild(skeleton);
    }
    
    try {
        const response = await fetch("/api/cameras");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        let cameras = [];
        if (Array.isArray(data)) {
            cameras = data;
        } else if (data && typeof data === 'object') {
            cameras = Object.entries(data).map(([name, cam]) => ({
                id: name,
                name: cam.name || name,
                location: cam.zone || cam.location || 'Unknown',
                status: cam.status || 'OFFLINE',
                stream: `/video_feed?camera_name=${encodeURIComponent(cam.name || name)}`,
                resolution: cam.resolution || '640x480',
                fps: cam.fps || 0,
                latency: cam.latency || 0,
                health: cam.health || 'UNKNOWN',
                is_recording: cam.is_recording || false,
                is_rtsp: cam.is_rtsp || false,
                type: cam.is_rtsp ? 'rtsp' : 'webcam'
            }));
        }
        
        // Remove skeletons
        grid.innerHTML = "";
        
        if (cameras.length === 0) {
            document.getElementById("emptyState").style.display = "block";
            document.getElementById("emptyState").innerHTML = `
                <div style="font-size:48px;margin-bottom:16px;opacity:0.6;">📹</div>
                <h3 style="color:#f1f5f9;margin:0 0 8px 0;">No Cameras Found</h3>
                <p style="color:#94a3b8;margin:0 0 20px 0;">Get started by adding your first camera.</p>
                <button class="cm-btn cm-btn-primary" onclick="openAddCameraModal()">Add Camera</button>
            `;
            return;
        }
        
        cameras.forEach((camera, index) => {
            const card = document.createElement("div");
            card.className = "cam-card";
            const isOnline = camera.status === "ONLINE";
            const typeClass = camera.type === 'rtsp' ? 'cam-type-rtsp' : camera.type === 'http' ? 'cam-type-http' : 'cam-type-webcam';
            const typeLabel = camera.type === 'rtsp' ? 'RTSP' : camera.type === 'http' ? 'HTTP' : 'WEBCAM';
            card.innerHTML = `
                <div class="cam-card-header">
                    <div>
                        <h3>${escapeHtml(camera.name)}</h3>
                        <span class="cam-type ${typeClass}">${typeLabel}</span>
                    </div>
                    <span class="${isOnline ? 'status-online' : camera.status === 'CONNECTING' ? 'status-connecting' : 'status-offline'}">
                        ● ${camera.status}
                    </span>
                </div>
                <div class="cam-card-body">
                    <div class="meta-row">
                        <span class="meta-label">Location</span>
                        <span class="meta-value">${escapeHtml(camera.location)}</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">Resolution</span>
                        <span class="meta-value">${camera.resolution}</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">FPS</span>
                        <span class="meta-value">${camera.fps}</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">Latency</span>
                        <span class="meta-value">${camera.latency} ms</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">Health</span>
                        <span class="meta-value">${camera.health}</span>
                    </div>
                </div>
                <div class="cam-card-footer">
                    ${isOnline ? `
                        <a href="/camera_view?camera=${encodeURIComponent(camera.name)}" style:none;"><button class="cm-btn cm-btn-primary">Live</button></a>
                        <button class="cm-btn cm-btn-secondary" onclick="stopCamera('${escapeHtml(camera.name)}')">Stop</button>
                    ` : `
                        <button class="cm-btn cm-btn-primary" onclick="startCamera('${escapeHtml(camera.name)}')">Start</button>
                        <button class="cm-btn cm-btn-secondary" onclick="removeCamera('${escapeHtml(camera.name)}')">Remove</button>
                    `}
                    <button class="cm-btn cm-btn-secondary" onclick="takeSnapshot('${escapeHtml(camera.name)}')">Snapshot</button>
                </div>
            `;
            grid.appendChild(card);
        });
    } catch (err) {
        grid.innerHTML = "";
        document.getElementById("emptyState").style.display = "block";
        document.getElementById("emptyState").innerHTML = `
            <div style="font-size:48px;margin-bottom:16px;opacity:0.6;">⚠️</div>
            <h3 style="color:#f1f5f9;margin:0 0 8px 0;">Unable to Load Cameras</h3>
            <p style="color:#94a3b8;margin:0 0 20px 0;">The camera service could not be reached.</p>
            <button class="cm-btn cm-btn-primary" onclick="loadCameras()">Retry</button>
        `;
    }
}

loadCameras();

async function takeSnapshot(cameraName) {
    try {
        const response = await fetch("/api/camera/snapshot", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ camera_name: cameraName })
        });
        const data = await response.json();
        if (data.success) {
            showToast("Snapshot", "Snapshot captured successfully", "success");
        } else {
            showToast("Snapshot", data.error || "Failed to capture snapshot", "error");
        }
    } catch (err) {
        showToast("Snapshot", "Failed to capture snapshot", "error");
    }
}

function showToast(title, message, type) {
    const toast = document.createElement("div");
    toast.style.cssText = `
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: #1b2432;
        border: 1px solid rgba(59, 130, 246, 0.2);
        border-radius: 12px;
        padding: 16px 20px;
        color: #f1f5f9;
        font-size: 14px;
        z-index: 9999;
        animation: slideIn 0.3s ease;
        max-width: 360px;
    `;
    toast.innerHTML = `
        <div style="font-weight: 600; margin-bottom: 4px;">${title}</div>
        <div style="color: #94a3b8;">${message}</div>
    `;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(10px)";
        toast.style.transition = "all 0.3s ease";
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}
</script>

{% endblock %}
