{% extends "base.html" %}

{% block content %}

<div class="page-content fade-in">

<div class="map-container chart-loading">

    <div class="loading-spinner small"></div>

    <img
    src="{{ url_for('static',filename='images/floorplan.png') }}"
    class="floor-map">

    <div class="camera-marker c1" data-marker="camera" data-index="0">📹</div>

    <div class="camera-marker c2" data-marker="camera" data-index="1">📹</div>

    <div class="camera-marker c3" data-marker="camera" data-index="2">📹</div>

    <div class="event-marker e1" data-marker="event" data-index="0">🚨</div>

    <div class="event-marker e2" data-marker="event" data-index="1">🚶</div>

    <div class="event-marker e3" data-marker="event" data-index="2">🚗</div>

    <div id="mapTooltip" class="map-tooltip" style="display:none;"></div>

</div>

<div id="emptyState" style="display:none;"></div>

<script>

(function() {

    setTimeout(function() {

        // In production, check if map data exists

        // If empty: showEmptyState("emptyState", "No Map Data", "Security map is not available.", [{label:"Retry", onclick:"loadMap()", class:"btn-primary"}])

    }, 600);

})();

</script>

</div>

{% endblock %}
