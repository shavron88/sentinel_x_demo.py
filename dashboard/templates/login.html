<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>SentinelX — Secure Access</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}?v=20260829">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        /* ==========================================
           CSS CUSTOM PROPERTIES
        ========================================== */
        :root {
            --page-bg: #0A0E17;
            --card-surface: #111827;
            --input-surface: #161F32;
            --border-default: rgba(148,163,196,0.12);
            --border-strong: rgba(148,163,196,0.24);
            --text-primary: #E9EDF7;
            --text-secondary: #8891A8;
            --text-muted: #5C647A;
            --accent-blue: #3E7BFA;
            --accent-text: #7FA6FF;
            --accent-dim: rgba(62,123,250,0.12);
            --success-green: #22C77A;
            --success-dim: rgba(34,199,122,0.12);
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        /* ==========================================
           RESET
        ========================================== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: auto;
            overflow-y: auto;
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-ui);
            background: var(--page-bg);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom scrollbar — WebKit */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(10, 14, 23, 0.6);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(62, 123, 250, 0.25);
            border-radius: 3px;
            border: 1px solid rgba(62, 123, 250, 0.1);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(62, 123, 250, 0.45);
        }

        /* Custom scrollbar — Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(62, 123, 250, 0.25) rgba(10, 14, 23, 0.6);
        }

        /* ==========================================
           BACKGROUND EFFECTS
        ========================================== */
        .scene {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* Faint grid */
        .scene::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(to right, rgba(62,123,250,0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(62,123,250,0.06) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        /* Glow blobs */
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            will-change: transform;
        }

        .glow--blue {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(62,123,250,0.35) 0%, transparent 70%);
            top: -120px;
            left: -120px;
            animation: drift 15s ease-in-out infinite;
        }

        .glow--green {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(34,199,122,0.28) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            animation: drift 16s ease-in-out infinite reverse;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -30px); }
        }

        /* Scanline */
        .scanline {
            position: absolute;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to bottom, transparent, rgba(62,123,250,0.08), transparent);
            animation: scan 5s linear infinite;
            will-change: transform;
        }

        @keyframes scan {
            0% { transform: translateY(-120px); }
            100% { transform: translateY(100vh); }
        }

        /* Particles canvas */
        #particleCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* ==========================================
           MAIN LAYOUT
        ========================================== */
        .auth-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* ==========================================
           BRAND BLOCK
        ========================================== */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
            opacity: 0;
            animation: fadeDrop 0.6s ease forwards;
        }

        .brand-icon {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #3E7BFA, #1E4FCF);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 8px 24px rgba(62,123,250,0.25);
        }

        /* Pulse ring */
        .brand-icon::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 18px;
            border: 2px solid rgba(62,123,250,0.35);
            animation: pulseRing 2.6s ease-out infinite;
            pointer-events: none;
        }

        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.25); opacity: 0; }
        }

        .brand-icon i {
            font-size: 26px;
            stroke-width: 2;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .brand-title .accent {
            color: var(--accent-blue);
        }

        .brand-subtitle {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .brand-tagline {
            font-size: 13px;
            font-style: italic;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* ==========================================
           LOGIN CARD
        ========================================== */
        .card {
            width: 100%;
            background: var(--card-surface);
            border: 1px solid var(--border-default);
            border-radius: 16px;
            padding: 28px 24px 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 24px 48px rgba(0,0,0,0.35);
            opacity: 0;
            animation: cardIn 0.6s ease 0.1s forwards;
            will-change: transform, opacity;
        }

        /* Top-edge gradient line */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.6;
        }

        @keyframes fadeDrop {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(10px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-header {
            text-align: center;
            margin-bottom: 22px;
            opacity: 0;
            animation: fieldIn 0.45s ease 0.18s forwards;
        }

        .card-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .card-header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ==========================================
           FORM FIELDS
        ========================================== */
        .field {
            margin-bottom: 16px;
            opacity: 0;
            animation: fieldIn 0.45s ease forwards;
        }

        .field:nth-child(1) { animation-delay: 0.24s; }
        .field:nth-child(2) { animation-delay: 0.30s; }

        .field label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .field label i {
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            height: 42px;
            padding: 0 14px;
            background: var(--input-surface);
            border: 1px solid var(--border-default);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrap input::placeholder {
            color: var(--text-muted);
            font-size: 13px;
        }

        .input-wrap input:hover {
            border-color: var(--border-strong);
        }

        .input-wrap input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--accent-dim);
            background: #1A2440;
        }

        /* Password toggle */
        .pw-wrap {
            position: relative;
        }

        .pw-wrap input {
            padding-right: 42px;
        }

        .pw-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }

        .pw-toggle:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.05);
        }

        .pw-toggle i {
            font-size: 18px;
        }

        /* ==========================================
           FORM OPTIONS ROW
        ========================================== */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            opacity: 0;
            animation: fieldIn 0.45s ease 0.36s forwards;
        }

        /* Custom checkbox */
        .check-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            user-select: none;
        }

        .check-label input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .check-box {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background: var(--input-surface);
            border: 1px solid var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .check-box i {
            font-size: 12px;
            color: #fff;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.15s ease;
        }

        .check-label input:checked + .check-box {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .check-label input:checked + .check-box i {
            opacity: 1;
            transform: scale(1);
        }

        .forgot-link {
            font-size: 13px;
            color: var(--accent-text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--accent-blue);
            text-decoration: underline;
        }

        /* ==========================================
           SUBMIT BUTTON
        ========================================== */
        .btn-login {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: var(--accent-blue);
            color: #fff;
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            transition: background 0.2s, transform 0.15s;
            opacity: 0;
            animation: fieldIn 0.45s ease 0.42s forwards;
        }

        .btn-login:hover {
            background: #2B63E0;
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Shine sweep */
        .btn-login::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
            transform: skewX(-20deg);
            animation: shine 3.2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0%, 100% { left: -100%; }
            50% { left: 150%; }
        }

        .btn-login i {
            font-size: 18px;
        }

        .btn-loader {
            display: none;
        }

        .btn-login.is-loading .btn-text {
            display: none;
        }

        .btn-login.is-loading .btn-loader {
            display: block;
        }

        /* ==========================================
           DIVIDER
        ========================================== */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 14px;
            opacity: 0;
            animation: fieldIn 0.45s ease 0.48s forwards;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-default);
        }

        .divider span {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* ==========================================
           STATUS PILL
        ========================================== */
        .status-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--success-dim);
            border: 1px solid rgba(34,199,122,0.15);
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            color: var(--success-green);
            margin: 0 auto;
            opacity: 0;
            animation: fieldIn 0.45s ease 0.54s forwards;
        }

        .status-dot {
            position: relative;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success-green);
            flex-shrink: 0;
        }

        /* Pulsing halo behind dot */
        .status-dot::after {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: rgba(34,199,122,0.35);
            animation: dotPulse 2s ease-out infinite;
            pointer-events: none;
        }

        @keyframes dotPulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .status-pill .sep {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ==========================================
           FOOTER
        ========================================== */
        .auth-footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            opacity: 0;
            animation: fadeDrop 0.6s ease 0.6s forwards;
        }

        .auth-footer strong {
            color: var(--text-secondary);
            font-weight: 600;
            transition: color 0.2s;
            cursor: default;
        }

        .auth-footer strong:hover {
            color: var(--accent-blue);
        }

        /* ==========================================
           ANIMATIONS
        ========================================== */
        @keyframes fieldIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================
           ERROR STATE
        ========================================== */
        .alert-error {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 10px;
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .alert-error.visible {
            display: flex;
        }

        .alert-error i {
            font-size: 16px;
            flex-shrink: 0;
            color: #ef4444;
        }

        /* Card shake */
        .card.shake {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* Exit transition */
        .auth-exit {
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.4s ease;
        }

        /* ==========================================
           RESPONSIVE
        ========================================== */
        @media (max-width: 768px) {
            .auth-wrap {
                padding: 28px 18px;
                gap: 22px;
            }

            .brand-title {
                font-size: 22px;
            }

            .brand-subtitle {
                font-size: 9px;
                letter-spacing: 0.18em;
            }

            .brand-tagline {
                font-size: 12px;
            }

            .card {
                padding: 22px 18px;
            }

            .card-header h2 {
                font-size: 18px;
            }

            .input-wrap input {
                height: 40px;
                font-size: 13px;
            }

            .btn-login {
                height: 42px;
                font-size: 13px;
            }

            .status-pill {
                font-size: 10px;
                padding: 6px 12px;
                gap: 6px;
            }

            .auth-footer {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .auth-wrap {
                padding: 20px 14px;
                gap: 18px;
            }

            .brand-icon {
                width: 48px;
                height: 48px;
                border-radius: 12px;
            }

            .brand-icon i {
                font-size: 22px;
            }

            .brand-title {
                font-size: 20px;
                letter-spacing: 0.06em;
            }

            .brand-subtitle {
                font-size: 8px;
                letter-spacing: 0.14em;
            }

            .brand-tagline {
                font-size: 11px;
            }

            .card {
                padding: 18px 14px 16px;
                border-radius: 14px;
            }

            .card-header h2 {
                font-size: 17px;
            }

            .card-header p {
                font-size: 12px;
            }

            .field label {
                font-size: 10px;
            }

            .input-wrap input {
                height: 38px;
                font-size: 12px;
                padding: 0 12px;
                border-radius: 8px;
            }

            .field {
                margin-bottom: 12px;
            }

            .form-options {
                margin-bottom: 14px;
            }

            .check-label,
            .forgot-link {
                font-size: 12px;
            }

            .btn-login {
                height: 40px;
                font-size: 12px;
                border-radius: 8px;
            }

            .status-pill {
                font-size: 10px;
                padding: 6px 12px;
            }

            .auth-footer {
                font-size: 11px;
            }

            .divider span {
                font-size: 9px;
            }
        }

        @media (max-width: 360px) {
            .auth-wrap {
                padding: 16px 10px;
                gap: 14px;
            }

            .brand-icon {
                width: 42px;
                height: 42px;
                border-radius: 10px;
            }

            .brand-title {
                font-size: 18px;
            }

            .brand-subtitle {
                font-size: 7px;
                letter-spacing: 0.1em;
            }

            .card {
                padding: 14px 12px 12px;
            }

            .input-wrap input {
                height: 36px;
                font-size: 11px;
            }

            .btn-login {
                height: 38px;
                font-size: 11px;
            }
        }

        @media (min-width: 1024px) {
            .auth-wrap {
                max-width: 400px;
            }
        }

        @media (max-width: 480px) and (max-height: 700px) {
            .auth-wrap {
                gap: 14px;
            }

            .brand {
                gap: 10px;
            }

            .brand-icon {
                width: 40px;
                height: 40px;
            }

            .brand-icon i {
                font-size: 18px;
            }

            .brand-title {
                font-size: 18px;
            }

            .brand-subtitle {
                font-size: 7px;
            }

            .brand-tagline {
                font-size: 10px;
            }

            .card {
                padding: 14px 12px 12px;
            }

            .card-header {
                margin-bottom: 14px;
            }

            .card-header h2 {
                font-size: 16px;
            }

            .field {
                margin-bottom: 10px;
            }

            .form-options {
                margin-bottom: 12px;
            }

            .divider {
                margin: 12px 0 10px;
            }
        }

        @media (min-width: 1024px) {
            .auth-wrap {
                max-width: 400px;
            }
        }

        @media (min-width: 1440px) {
            .auth-wrap {
                max-width: 420px;
                padding: 40px 24px;
            }

            .card {
                padding: 32px 28px 28px;
            }
        }
    </style>
</head>
<body>
    <!-- ====== BACKGROUND SCENE ====== -->
    <div class="scene" aria-hidden="true">
        <div class="glow glow--blue"></div>
        <div class="glow glow--green"></div>
        <div class="scanline"></div>
        <canvas id="particleCanvas"></canvas>
    </div>

    <!-- ====== MAIN CONTENT ====== -->
    <main class="auth-wrap" id="authMain">
        <!-- Brand -->
        <div class="brand">
            <div class="brand-icon">
                <i class="ti ti-shield-check"></i>
            </div>
            <h1 class="brand-title">SENTINEL<span class="accent">X</span></h1>
            <p class="brand-subtitle">AI EDGE SURVEILLANCE PLATFORM</p>
            <p class="brand-tagline">Intelligent security. Real-time awareness.</p>
        </div>

        <!-- Card -->
        <div class="card" id="loginCard">
            <div class="card-header">
                <h2>Secure access</h2>
                <p>Sign in to the operations center.</p>
            </div>

            <div class="alert-error" id="loginError" role="alert" aria-live="assertive">
                <i class="ti ti-circle-x"></i>
                <span id="loginErrorText">Authentication failed</span>
            </div>

            <form id="loginForm" autocomplete="on" novalidate>
                <!-- Username -->
                <div class="field">
                    <label for="username">
                        <i class="ti ti-user"></i>
                        Username
                    </label>
                    <div class="input-wrap">
                        <input type="text" id="username" name="username"
                               placeholder="Enter your username" required
                               autocomplete="username" autofocus>
                    </div>
                </div>

                <!-- Password -->
                <div class="field">
                    <label for="password">
                        <i class="ti ti-lock"></i>
                        Password
                    </label>
                    <div class="pw-wrap">
                        <div class="input-wrap">
                            <input type="password" id="password" name="password"
                                   placeholder="Enter your password" required
                                   autocomplete="current-password">
                        </div>
                        <button type="button" class="pw-toggle" id="pwToggle"
                                aria-label="Toggle password visibility" tabindex="0">
                            <i class="ti ti-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember / Forgot -->
                <div class="form-options">
                    <label class="check-label">
                        <input type="checkbox" id="rememberMe" name="remember">
                        <span class="check-box">
                            <i class="ti ti-check"></i>
                        </span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">
                        <i class="ti ti-shield-lock"></i>
                        Authorize access
                    </span>
                    <span class="btn-loader" aria-hidden="true">
                        <i class="ti ti-loader-2"></i>
                    </span>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>Connection status</span>
            </div>

            <!-- Status pill -->
            <div class="status-pill">
                <span class="status-dot"></span>
                Secure connection
                <span class="sep">&middot;</span>
                AES-256 encrypted
            </div>
        </div>

        <!-- Footer -->
        <footer class="auth-footer">
            <p>Need an operator account? <strong>Contact your administrator</strong></p>
        </footer>
    </main>

    <script>
    (function() {
        "use strict";

        /* ==========================================
           DOM REFERENCES
        ========================================== */
        var form      = document.getElementById("loginForm");
        var userEl    = document.getElementById("username");
        var passEl    = document.getElementById("password");
        var btn       = document.getElementById("loginBtn");
        var errorBox  = document.getElementById("loginError");
        var errorText = document.getElementById("loginErrorText");
        var pwToggle  = document.getElementById("pwToggle");
        var eyeIcon   = document.getElementById("eyeIcon");
        var canvas    = document.getElementById("particleCanvas");

        /* ==========================================
           PASSWORD SHOW / HIDE
        ========================================== */
        pwToggle.addEventListener("click", function() {
            var isPassword = passEl.type === "password";
            passEl.type = isPassword ? "text" : "password";
            eyeIcon.className = isPassword ? "ti ti-eye-off" : "ti ti-eye";
        });

        /* ==========================================
           FORM SUBMISSION
        ========================================== */
        form.addEventListener("submit", function(e) {
            e.preventDefault();
            hideError();
            setLoading(true);

            var username = userEl.value.trim();
            var password = passEl.value;

            if (!username || !password) {
                showError("Please enter both username and password.");
                setLoading(false);
                return;
            }

            fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
            .then(function(result) {
                if (result.ok) {
                    if (result.data.csrf_token) {
                        try { sessionStorage.setItem("sentinelx_csrf", result.data.csrf_token); } catch(e) {}
                    }
                    document.getElementById("authMain").classList.add("auth-exit");
                    setTimeout(function() { window.location.href = "/"; }, 500);
                } else {
                    showError(result.data.message || "Authentication failed. Please try again.");
                    setLoading(false);
                    passEl.value = "";
                    passEl.focus();
                }
            })
            .catch(function(err) {
                showError("Connection error. Please check the server and try again.");
                setLoading(false);
            });
        });

        /* ==========================================
           UI HELPERS
        ========================================== */
        function setLoading(loading) {
            btn.disabled = loading;
            btn.classList.toggle("is-loading", loading);
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorBox.classList.add("visible");
            var card = document.getElementById("loginCard");
            card.classList.add("shake");
            setTimeout(function() { card.classList.remove("shake"); }, 500);
        }

        function hideError() {
            errorBox.classList.remove("visible");
        }

        /* ==========================================
           PARTICLES (Canvas)
        ========================================== */
        var prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (!prefersReducedMotion && canvas && canvas.getContext) {
            var ctx = canvas.getContext("2d");
            var particles = [];
            var PARTICLE_COUNT = 20;
            var animId;

            function resizeCanvas() {
                canvas.width  = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function createParticle(randomY) {
                return {
                    x: Math.random() * canvas.width,
                    y: randomY ? Math.random() * canvas.height : canvas.height + 10,
                    vy: -(Math.random() * 0.35 + 0.15),
                    r: Math.random() * 1.5 + 1.5,
                    life: Math.random(),
                    speed: Math.random() * 0.006 + 0.004,
                    delay: Math.random() * 8
                };
            }

            function initParticles() {
                particles = [];
                for (var i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push(createParticle(true));
                }
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    p.y += p.vy;
                    p.life += p.speed;

                    if (p.life > 1) {
                        particles[i] = createParticle(false);
                        continue;
                    }

                    var alpha = Math.sin(p.life * Math.PI) * 0.55;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(62, 123, 250, " + alpha + ")";
                    ctx.fill();
                }

                animId = requestAnimationFrame(drawParticles);
            }

            resizeCanvas();
            initParticles();
            drawParticles();

            window.addEventListener("resize", function() {
                resizeCanvas();
                initParticles();
            });

            document.addEventListener("visibilitychange", function() {
                if (document.hidden) {
                    cancelAnimationFrame(animId);
                } else {
                    drawParticles();
                }
            });
        }

        /* ==========================================
           AUTO-FOCUS
        ========================================== */
        userEl.focus();

    })();
    </script>
</body>
</html>
